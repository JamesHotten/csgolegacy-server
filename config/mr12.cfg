// CS2-style MR12 match rules: 12-round halves, first to 13 wins.
mp_maxrounds 24
mp_match_can_clinch 1
mp_halftime 1

// Overtime: 3 rounds per half (6 rounds total), $10,000 start money.
mp_overtime_enable 1
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000

// Current CS2 economy additions on top of the CS:GO Legacy engine economy.
sm_lan_economy_ruleset 1
sm_lan_economy_cs2_ct_kill_bonus 50

echo "CS2 MR12 rules and economy loaded"
